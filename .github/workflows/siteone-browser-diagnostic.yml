name: WQT SiteOne Browser Diagnostic (manual, LDW only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wqt-siteone-browser-single-page-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify pinned SiteOne and preinstalled Chrome
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/download-siteone.sh
          browser="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$browser" || ! -x "$browser" ]]; then
            echo "No preinstalled executable Chrome; refusing browser download or sandbox downgrade." >&2
            exit 1
          fi
          help="$(tools/bin/siteone-crawler --help 2>&1)"
          for option in --single-page --browser --browser-path --browser-workers --workers --max-reqs-per-sec --timeout --browser-timeout --output-json-file; do
            if ! grep -Fq -- "$option" <<< "$help"; then
              echo "Pinned SiteOne does not advertise required option: $option" >&2
              exit 1
            fi
          done
          printf 'WQT_DIAGNOSTIC_CHROME=%s\n' "$browser" >> "$GITHUB_ENV"

      - name: Inspect only the public LDW homepage, without clearance or proxy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          rc=0
          tools/bin/siteone-crawler \
            --url=https://lowcountrydigitalworks.com/ \
            --single-page \
            --browser \
            --browser-path="$WQT_DIAGNOSTIC_CHROME" \
            --browser-workers=1 \
            --workers=1 \
            --max-reqs-per-sec=1 \
            --timeout=15 \
            --browser-timeout=25 \
            --output=json \
            --output-json-file="$scratch/siteone.json" \
            --output-html-report='' \
            --output-text-file='' \
            > "$scratch/siteone-stdout-stderr.log" 2>&1 || rc=$?
          node scripts/siteone-browser-diagnostic.mjs \
            "$scratch/siteone.json" \
            "$RUNNER_TEMP/siteone-browser-sanitized.json" \
            "$rc"
          node --input-type=module -e '
            import fs from "node:fs";
            const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/siteone-browser-sanitized.json", "utf8"));
            process.stdout.write("Diagnostic only: " + s.coverage + "; root status " + String(s.rootHttpStatus) + "; challenge-resource observed " + String(s.challengeResourceObserved) + "\n");
          '

      - name: Upload ONLY bounded sanitized diagnostic, never raw scanner output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wqt-siteone-browser-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/siteone-browser-sanitized.json
          if-no-files-found: warn
          retention-days: 7
