name: WQT Guarded External Link Reachability

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: >-
          Authorized registered site identifier. This is an opaque Site ID,
          not a URL; resolution remains fail-closed through config/targets.json.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wqt-external-links-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.0'
          check-latest: false

      - name: Record deterministic tool surfaces
        run: |
          node --version
          npm --version
          python --version
          curl --version | head -1

      - name: Install exact locked Node dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate existing WQT plus guarded sidecar offline
        run: |
          bash -n scripts/*.sh
          node --check scripts/normalize.mjs
          node --check scripts/write-summary.mjs
          node --check scripts/resolve-target.mjs
          python -m py_compile scripts/external_links.py
          npm test
          python -m unittest discover -v -s test -p 'test_external_links.py'

  probe:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WQT_SITE_ID: ${{ inputs.site }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up exact Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14.0'
          check-latest: false

      - name: Download and verify SiteOne
        run: bash scripts/download-siteone.sh

      - name: Collect accepted site_only SiteOne evidence
        run: bash scripts/run-siteone.sh artifacts/raw/siteone.json

      - name: Run guarded external-link sidecar
        run: bash scripts/run-external-links.sh

      - name: Write bounded external-link operator summary
        run: cat artifacts/external-links/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bounded external-link evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wqt-external-links-${{ inputs.site }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30