name: External Link Reachability Sidecar

on:
  pull_request:
  workflow_dispatch:
    inputs:
      site:
        description: >-
          Authorized site identifier. Validated fail-closed against
          config/targets.json at run time; this is an opaque ID, not a URL,
          and an unregistered/disabled value stops the run before any scan.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate scripts, target allowlist, and normalization fixtures
        run: |
          bash -n scripts/*.sh
          node --check scripts/*.mjs
          npm test

      - name: Verify SiteOne release artifact
        run: bash scripts/download-siteone.sh

  probe:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WQT_SITE_ID: ${{ inputs.site }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download and verify SiteOne
        run: bash scripts/download-siteone.sh

      - name: Collect raw SiteOne evidence
        run: bash scripts/run-siteone.sh artifacts/raw/siteone.json

      - name: Run external-link reachability probe sidecar
        run: |
          node scripts/probe-external-links.mjs \
            --site-id "$WQT_SITE_ID" \
            --siteone artifacts/raw/siteone.json \
            --output artifacts/external-links.json \
            --summary artifacts/external-links-summary.md

      - name: Write operator evidence summary
        run: cat artifacts/external-links-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload external-link sidecar and report evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-links-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
