name: Website Quality Baseline 0.1

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

concurrency:
  group: website-quality-lowcountrydigitalworks-${{ github.event_name }}
  cancel-in-progress: true

env:
  WQT_TARGET: https://lowcountrydigitalworks.com

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate scripts and normalization fixtures
        run: |
          bash -n scripts/*.sh
          node --check scripts/normalize.mjs
          node --check scripts/write-summary.mjs
          npm test

      - name: Verify SiteOne release artifact
        run: bash scripts/download-siteone.sh

  scan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download and verify SiteOne
        run: bash scripts/download-siteone.sh

      - name: Collect raw SiteOne evidence
        run: bash scripts/run-siteone.sh artifacts/raw/siteone.json

      - name: Collect raw Lighthouse evidence
        run: bash scripts/run-lighthouse.sh artifacts/raw/lighthouse.json

      - name: Normalize evidence
        run: |
          node scripts/normalize.mjs \
            --target "$WQT_TARGET" \
            --siteone artifacts/raw/siteone.json \
            --lighthouse artifacts/raw/lighthouse.json \
            --output artifacts/normalized/website-quality.json

      - name: Write concise evidence summary
        run: node scripts/write-summary.mjs artifacts/normalized/website-quality.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw and normalized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-quality-lowcountrydigitalworks-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
