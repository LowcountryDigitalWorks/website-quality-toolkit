name: WQT Security Baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql-javascript:
    permissions:
      contents: read
      security-events: write
    uses: LowcountryDigitalWorks/.github/.github/workflows/security-codeql-js.yml@ea28529418ac13b0d529db499ae0168da2a48e4d

  codeql-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python

  secret-scan:
    uses: LowcountryDigitalWorks/.github/.github/workflows/security-secrets.yml@ea28529418ac13b0d529db499ae0168da2a48e4d
    with:
      verify_canary: false

  dependency-scan:
    uses: LowcountryDigitalWorks/.github/.github/workflows/security-dependencies-npm.yml@ea28529418ac13b0d529db499ae0168da2a48e4d
    with:
      online_queries: false
      verify_canary: false
