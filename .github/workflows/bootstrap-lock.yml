name: Bootstrap Baseline 0.1 lockfile

on:
  pull_request:
    paths:
      - package.json
      - .nvmrc
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Generate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify exact Lighthouse resolution
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const resolved = lock.packages?.['node_modules/lighthouse']?.version;
          if (resolved !== '13.4.1') {
            throw new Error(`Expected lighthouse 13.4.1, resolved ${resolved ?? 'nothing'}`);
          }
          if ((lock.lockfileVersion ?? 0) < 3) {
            throw new Error(`Expected npm lockfileVersion >= 3, found ${lock.lockfileVersion}`);
          }
          NODE

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-0.1-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
